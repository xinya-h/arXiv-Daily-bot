name: arXiv Daily Bot
on:
  schedule:
    # UTC时间0点 = 北京时间 08:00
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动点按钮触发测试

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true # 允许提交 seen_papers.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install arxiv requests

      - name: Run TDE Bot
        env:
          DING_WEBHOOK: ${{ secrets.DING_WEBHOOK }}
        run: python tde_bot.py

      - name: Commit updated seen_TDE_papers.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_papers.json
          git commit -m "Update seen paper list" || echo "No changes to commit"
          git push
